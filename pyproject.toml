[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"


[project]
name = "autogen-wick"
version = "0.2.0"
description = "Automatic Wick's theorem expression generator for quantum chemistry (unitary coupled cluster, CC, etc)."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Ayush Asthana" }]
urls = { "Homepage" = "https://github.com/asthanaa/autogen", "Documentation" = "https://asthanaa.github.io/autogen/" }
classifiers = [
	"Programming Language :: Python :: 3",
	"Programming Language :: Python :: 3.10",
	"Programming Language :: Python :: 3.11",
	"Programming Language :: Python :: 3.12",
	"Operating System :: OS Independent",
	"Intended Audience :: Science/Research",
	"Topic :: Scientific/Engineering :: Chemistry",
	"Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
	"numpy>=1.24",
	"scipy>=1.10",
	"matplotlib>=3.7",
	"threadpoolctl>=3.2",
	"tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
molecular = ["pyscf>=2.6"]
test = ["pytest>=7.4"]
dev = ["build>=1.2", "pytest>=7.4", "ruff>=0.5"]

[project.scripts]
qpccsd = "autogen.methods.qpccsd.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["autogen*", "generated_code*"]

[tool.setuptools.package-data]
"*" = ["*.json"]

[tool.setuptools.exclude-package-data]
"*" = [
	"backup/**",
	"tests/**",
	"**/__pycache__/**",
	"backup/debug_files/**",
	"backup/library_activeorb/**",
	"backup/ucc_terms/**",
	"backup/uccsd_terms/**",
	"backup/*.py",
	"backup/**/*.py",
	"backup/**/*.txt",
	"backup/**/*.pdf",
	"backup/**/*.docx",
	"backup/**/*.bak"
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
