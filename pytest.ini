[pytest]
testpaths = tests
python_files = test_*.py
addopts = -q -ra -m "not molecular and not remote"
pythonpath = src
norecursedirs = archive artifacts build dist results tmp* .git
xfail_strict = true
markers =
	molecular: requires molecular integral/reference generation and must run only on an approved remote host
	remote: must run on Medora, Talon, or an authorized remote desktop
	slow: long-running synthetic or numerical regression
	legacy_reference_projected: exercises a frozen legacy projected-reference route
