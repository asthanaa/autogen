name: Python package

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
      - name: Validate repository contract
        run: |
          python scripts/validate_repository.py
          python scripts/check_repository_blobs.py --base origin/master --limit-mib 50
      - name: Run non-molecular tests
        run: python -m pytest

  distribution:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build source and wheel distributions
        run: |
          python -m pip install --upgrade pip
          python -m pip install build
          python -m build
      - name: Validate wheel outside the checkout
        run: |
          wheel="$(find dist -maxdepth 1 -name '*.whl' -print -quit)"
          test -n "$wheel"
          python scripts/validate_clean_install.py "$wheel"
      - uses: actions/upload-artifact@v4
        with:
          name: autogen-distributions
          path: dist/

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build documentation strictly
        run: |
          python -m pip install mkdocs mkdocs-material
          mkdocs build --strict
