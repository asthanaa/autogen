name: Publish Python 🐍 distribution 📦 to PyPI

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  id-token: write  # IMPORTANT: this permission is required for trusted publishing
  contents: read

jobs:
  build-and-publish:
    name: Build and publish Python 🐍 distribution 📦 to PyPI
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/autogen-wick/
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Build package
        run: |
          python -m pip install --upgrade pip
          python -m pip install build
          python scripts/validate_repository.py
          python scripts/check_repository_blobs.py --limit-mib 50
          python -m build

      - name: Validate wheel outside the checkout
        run: |
          wheel="$(find dist -maxdepth 1 -name '*.whl' -print -quit)"
          test -n "$wheel"
          python scripts/validate_clean_install.py "$wheel"

      - name: Publish package to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
